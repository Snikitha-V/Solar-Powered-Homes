# PM Surya Ghar Solar Verification System
# Conda Environment Configuration
# 
# Create with: conda env create -f environment.yml
# Activate with: conda activate solar-verification

name: solar-verification
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11.9
  
  # PyTorch with CUDA support
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8
  
  # Image Processing
  - opencv>=4.8.0
  - numpy>=1.24.0
  - pillow>=10.0.0
  
  # Data Processing
  - pandas>=2.0.0
  - openpyxl>=3.1.0
  
  # Geospatial
  - shapely>=2.0.0
  
  # Networking
  - requests>=2.31.0
  
  # CLI Tools
  - tqdm>=4.65.0
  
  # pip dependencies
  - pip
  - pip:
    # YOLO
    - ultralytics>=8.0.0
    
    # Segment Anything Models
    - git+https://github.com/facebookresearch/segment-anything.git
    - git+https://github.com/facebookresearch/segment-anything-2.git
    
    # Geospatial
    - geopy>=2.4.0
    
    # Configuration
    - pydantic>=2.0.0
    - python-dotenv>=1.0.0
    
    # Hydra (for SAM2)
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0
